<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relógio Desktop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clock-window">
    <div class="bg-fill"></div>
    <div class="topbar">
      <div class="brand" id="brandText">RELÓGIO DESKTOP</div>
      <div class="window-buttons">
        <button id="settingsBtn">⚙</button>
        <button id="pinBtn" title="Sempre visível">#</button>
        <button id="minBtn" title="Minimizar">—</button>
        <button id="closeBtn" title="Fechar">×</button>
      </div>

      
    </div>

    <section class="display">

      <div class="left-panel">
        <div class="ampm">
          <span id="am">AM</span>
          <span id="pm">PM</span>
        </div>

        <div class="cronometro">
          <div id="hora" class="seven-row"></div>
          <div class="colon">:</div>
          <div id="minuto" class="seven-row"></div>
          <div class="colon">:</div>
          <div id="segundo" class="seven-row"></div>
        </div>

        <div class="days" id="days">
          <span>DOM</span>
          <span>SEG</span>
          <span>TER</span>
          <span>QUA</span>
          <span>QUI</span>
          <span>SEX</span>
          <span>SAB</span>
        </div>
      </div>

      <aside class="info-panel">
        <div class="date-box">
          <span id="date"></span>
        </div>

        <div class="temperature">
          <span id="temperature">--</span><small id="tempUnit">°C</small>
        </div>

        <div class="controls">
          <button id="formatBtn">24H</button>
          <button id="weatherBtn">TEMPO</button>
        </div>
      </aside>
    </section>

<div id="settingsPanel" class="settings-panel">

  <div class="settings-title-row">
    <span class="settings-title" id="settingsTitleText">CONFIGURAÇÕES</span>
    <button id="settingsCloseBtn" class="settings-close" title="Fechar" type="button">×</button>
  </div>

  <label class="setting-item">

    <input
      type="checkbox"
      id="startupCheck"
    >

    <span id="startupLabelText">
      Iniciar com o Windows
    </span>

  </label>

  <div class="setting-item setting-slider">

    <div class="setting-slider-row">
      <span id="opacityLabelText">Opacidade do fundo</span>
      <span id="opacityValue">100%</span>
    </div>

    <input
      type="range"
      id="opacityRange"
      min="0"
      max="100"
      value="100"
      step="1"
    >

  </div>

  <div class="setting-item setting-colors">

    <span class="setting-colors-label" id="colorLabelText">Cor dos textos ativos</span>

    <div class="color-options">

      <label class="color-swatch">
        <input type="radio" name="activeColor" value="pink" checked>
        <span class="swatch-dot" style="--swatch-color: var(--color-pink);"></span>
      </label>

      <label class="color-swatch">
        <input type="radio" name="activeColor" value="green">
        <span class="swatch-dot" style="--swatch-color: var(--color-green);"></span>
      </label>

      <label class="color-swatch">
        <input type="radio" name="activeColor" value="red">
        <span class="swatch-dot" style="--swatch-color: var(--color-red);"></span>
      </label>

      <label class="color-swatch">
        <input type="radio" name="activeColor" value="blue">
        <span class="swatch-dot" style="--swatch-color: var(--color-blue);"></span>
      </label>

    </div>

  </div>

  <div class="setting-item setting-lang">

    <span id="langLabelText">Idioma</span>

    <div class="lang-options">

      <label class="lang-pill">
        <input type="radio" name="appLanguage" value="pt-br" checked>
        <span class="lang-pill-text">PT-BR</span>
      </label>

      <label class="lang-pill">
        <input type="radio" name="appLanguage" value="en-us">
        <span class="lang-pill-text">EN-US</span>
      </label>

    </div>

  </div>

</div>

  <div id="resizeHandle" class="resize-handle" title="Arraste para redimensionar"></div>

  </main>

  <script src="renderer.js"></script>
</body>
</html>
